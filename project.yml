# XcodeGen project definition. Run `xcodegen generate` to create RandomPodcast.xcodeproj.
name: RandomPodcast

options:
  bundleIdPrefix: com.leonardoramirezr
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    # Build settings that CI overrides from the command line (see .github/workflows/build.yml).
    BUNDLE_ID: com.leonardoramirezr.podcastrandombyleoneralabs
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    # Public PKCE client ID from the Spotify Developer Dashboard. It is not a secret.
    SPOTIFY_CLIENT_ID: REPLACE_WITH_SPOTIFY_CLIENT_ID
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

targets:
  RandomPodcast:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Random Podcast by Leonera Labs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - en
          - es
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        PRODUCT_NAME: RandomPodcast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
